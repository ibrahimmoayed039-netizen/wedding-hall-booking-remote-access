<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حجوزات القاعة</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0f172a;}
  #topbar{position:fixed;top:0;left:0;right:0;height:48px;background:#1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:10;padding-top:env(safe-area-inset-top);}
  #topbar h1{color:#f1f5f9;font-size:14px;margin:0;}
  #settingsBtn{background:none;border:none;color:#94a3b8;font-size:20px;padding:6px;}
  #frameWrap{position:absolute;top:48px;left:0;right:0;bottom:0;}
  iframe{width:100%;height:100%;border:none;background:#0f172a;}
  #settingsScreen{position:fixed;inset:0;background:#0f172a;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:24px;}
  #settingsScreen h2{color:#f1f5f9;font-size:18px;margin-bottom:4px;}
  #settingsScreen p{color:#94a3b8;font-size:13px;margin-bottom:20px;}
  #settingsScreen label{color:#cbd5e1;font-size:13px;display:block;margin-bottom:6px;}
  #settingsScreen input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;font-size:15px;margin-bottom:16px;direction:ltr;text-align:left;}
  #settingsScreen button{width:100%;padding:13px;border:none;border-radius:10px;background:#6366f1;color:#fff;font-size:15px;font-weight:600;}
  #settingsHint{background:#1e293b;border-radius:10px;padding:12px;font-size:12px;color:#94a3b8;margin-bottom:16px;line-height:1.7;}
  #closeSettingsBtn{background:none !important;color:#94a3b8 !important;margin-top:10px;font-size:13px;}
</style>
</head>
<body>
  <div id="topbar">
    <h1 id="titleText">حجوزات القاعة</h1>
    <button id="settingsBtn" onclick="openSettings()">⚙️</button>
  </div>
  <div id="frameWrap">
    <iframe id="viewFrame" src="about:blank"></iframe>
  </div>

  <div id="settingsScreen" style="display:none;">
    <h2>إعداد الاتصال بالخادم</h2>
    <p>أدخل عنوان الجهاز الرئيسي (القاعة) ورمز الدخول الظاهر في إعدادات البرنامج → الوصول عن بُعد</p>
    <div id="settingsHint">
      📶 نفس الشبكة: استخدم عنوان IP المحلي (مثال: 192.168.1.10)<br>
      🌍 فرع بمكان آخر: ثبّت Radmin VPN على الجهازين واستخدم عنوان IP الذي يعطيه Radmin
    </div>
    <label>عنوان الخادم (IP:المنفذ)</label>
    <input id="serverAddrInput" placeholder="مثال: 192.168.1.10:4500">
    <label>رمز الدخول (Token)</label>
    <input id="tokenInputField" placeholder="مثال: a1b2c3d4">
    <button onclick="saveSettings()">اتصال وحفظ</button>
    <button id="closeSettingsBtn" onclick="closeSettings()">إلغاء</button>
  </div>

<script>
function buildUrl(addr, token){
  addr = addr.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
  return 'http://' + addr + '/?token=' + encodeURIComponent(token.trim());
}
function loadSaved(){
  const addr = localStorage.getItem('serverAddr');
  const token = localStorage.getItem('serverToken');
  if (addr && token) {
    document.getElementById('viewFrame').src = buildUrl(addr, token);
    document.getElementById('settingsScreen').style.display = 'none';
  } else {
    openSettings();
  }
}
function openSettings(){
  document.getElementById('serverAddrInput').value = localStorage.getItem('serverAddr') || '';
  document.getElementById('tokenInputField').value = localStorage.getItem('serverToken') || '';
  document.getElementById('settingsScreen').style.display = 'flex';
}
function closeSettings(){
  if (localStorage.getItem('serverAddr')) {
    document.getElementById('settingsScreen').style.display = 'none';
  }
}
function saveSettings(){
  const addr = document.getElementById('serverAddrInput').value.trim();
  const token = document.getElementById('tokenInputField').value.trim();
  if (!addr || !token) { alert('الرجاء تعبئة العنوان ورمز الدخول'); return; }
  localStorage.setItem('serverAddr', addr);
  localStorage.setItem('serverToken', token);
  document.getElementById('viewFrame').src = buildUrl(addr, token);
  document.getElementById('settingsScreen').style.display = 'none';
}
loadSaved();
</script>
</body>
</html>
