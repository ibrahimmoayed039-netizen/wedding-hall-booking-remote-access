name: Build EXE and APK (Zipped)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies (Electron app)
        run: npm install

      - name: Build Windows EXE
        run: npm run build

      - name: Upload EXE (temporary, for packaging)
        uses: actions/upload-artifact@v4
        with:
          name: exe-temp
          path: dist/*.exe

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (required for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies (Capacitor + ML Kit barcode scanner)
        working-directory: android-app
        run: npm install

      - name: Generate native Android project (if not committed)
        working-directory: android-app
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found - generating it now."
            npx cap add android
          else
            echo "android/ folder already exists - skipping."
          fi

      - name: Sync Capacitor plugins into native project
        working-directory: android-app
        run: npx cap sync android

      - name: Verify camera permission was added by ML Kit sync
        working-directory: android-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "Camera permission present in AndroidManifest.xml."
          else
            echo "Camera permission missing - adding it manually as a safety net."
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
          fi

      - name: Grant execute permission for gradlew
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK (temporary, for packaging)
        uses: actions/upload-artifact@v4
        with:
          name: apk-temp
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

  package-zip:
    needs: [ build-exe, build-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: exe-temp
          path: package/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-temp
          path: package/

      - name: Create ZIP with both files
        run: |
          cd package
          zip -j app-release.zip *.exe *.apk
          ls -la

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: app-release-zip
          path: package/app-release.zip
