name: Build App (Windows + Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------- بناء برنامج الويندوز (exe) ----------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-hall-booking-setup
          path: dist/*.exe

  # ---------- بناء تطبيق الأندرويد (APK) ----------
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # يسمح للتطبيق بالاتصال بعناوين HTTP العادية داخل الشبكة المحلية أو Radmin VPN
      - name: Allow cleartext (HTTP) network traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: hall-bookings-viewer-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
