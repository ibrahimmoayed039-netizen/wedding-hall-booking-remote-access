name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (required for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies (Capacitor + ML Kit barcode scanner)
        working-directory: android-app
        run: npm install

      - name: Generate native Android project (if not committed)
        working-directory: android-app
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found - generating it now."
            npx cap add android
          else
            echo "android/ folder already exists - skipping."
          fi

      - name: Sync Capacitor plugins into native project
        working-directory: android-app
        run: npx cap sync android

      - name: Verify camera permission was added by ML Kit sync
        working-directory: android-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "Camera permission present in AndroidManifest.xml."
          else
            echo "Camera permission missing - adding it manually as a safety net."
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
          fi

      - name: Grant execute permission for gradlew
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
